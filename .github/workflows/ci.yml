name: CI

on:
  push:
    branches: [develop, deploy/render]
  pull_request:
    branches: [develop, deploy/render]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests and coverage verification
        run: ./mvnw -B clean verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  container:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag users-management-api:ci .

      - name: Start PostgreSQL for smoke test
        run: |
          docker network create users-management-ci
          docker run --detach \
            --name users-management-db-ci \
            --network users-management-ci \
            --health-cmd "pg_isready -U postgres -d crud_usuarios" \
            --health-interval 2s \
            --health-timeout 3s \
            --health-retries 20 \
            --health-start-period 5s \
            --env POSTGRES_DB=crud_usuarios \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=ci_test_password \
            postgres:17-alpine

          for attempt in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' users-management-db-ci 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs users-management-db-ci
              exit 1
            fi
            sleep 2
          done

          docker logs users-management-db-ci
          echo "PostgreSQL did not become healthy in time."
          exit 1

      - name: Run application and check health endpoint
        run: |
          docker run --detach \
            --name users-management-api-ci \
            --network users-management-ci \
            --publish 8080:8080 \
            --env DB_HOST=users-management-db-ci \
            --env DB_PORT=5432 \
            --env DB_NAME=crud_usuarios \
            --env DB_USERNAME=postgres \
            --env DB_PASSWORD=ci_test_password \
            --env DB_SSLMODE=disable \
            --env APP_EMAIL_ENABLED=false \
            users-management-api:ci

          for attempt in $(seq 1 30); do
            response=$(curl --fail --silent http://127.0.0.1:8080/actuator/health || true)
            if [ -n "$response" ]; then
              echo "$response"
              echo "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'
              exit $?
            fi

            running=$(docker inspect --format='{{.State.Running}}' users-management-api-ci 2>/dev/null || true)
            if [ "$running" != "true" ]; then
              docker logs users-management-api-ci
              exit 1
            fi
            sleep 2
          done

          docker logs users-management-api-ci
          echo "The application health endpoint did not become available in time."
          exit 1

      - name: Clean up smoke-test containers
        if: always()
        run: |
          docker rm --force users-management-api-ci users-management-db-ci 2>/dev/null || true
          docker network rm users-management-ci 2>/dev/null || true
