services:
  - type: web
    name: users-management-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: deploy/render
    region: virginia
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: DB_SCHEMA_INIT_MODE
        value: never
      - key: DB_POOL_MIN_IDLE
        value: "0"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_SECONDS
        value: "900"
      - key: SEED_ADMIN_ENABLED
        value: "false"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: APP_EMAIL_ENABLED
        value: "false"
      - key: APP_EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_ADDRESS
        sync: false
      - key: BREVO_FROM_NAME
        value: Gestion de Usuarios
      - key: APP_KAFKA_ENABLED
        value: "true"
      - key: APP_DOMAIN_EVENTS_ENABLED
        value: "true"
      - key: APP_KAFKA_IN_PROCESS_WORKER_ENABLED
        value: "false"
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_USERNAME
        sync: false
      - key: KAFKA_PASSWORD
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: KAFKA_SSL_TRUST_CERTIFICATES
        sync: false
      - key: SUPABASE_STORAGE_ENABLED
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: users-management-bucket
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_CACHE_ENABLED
        value: "false"
      - key: APP_CACHE_TTL_SECONDS
        value: "300"
      - key: VALKEY_HOST
        sync: false
      - key: VALKEY_PORT
        value: "10274"
      - key: VALKEY_USERNAME
        value: default
      - key: VALKEY_PASSWORD
        sync: false
      - key: VALKEY_SSL_ENABLED
        value: "true"
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER_ADDRESS
        sync: false
      - key: GMAIL_SENDER_NAME
        value: Gestion de Usuarios

databases:
  - name: users-management-db
    databaseName: crud_usuarios
    user: users_management
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    ipAllowList: []
