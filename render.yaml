services:
  - type: web
    name: users-management-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: deploy/render
    region: virginia
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_EMAIL_ENABLED
        value: "false"
      - key: APP_EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_ADDRESS
        sync: false
      - key: SMTP_FROM_NAME
        value: Gestion de Usuarios

databases:
  - name: users-management-db
    databaseName: crud_usuarios
    user: users_management
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    ipAllowList: []
