# Spring Boot
spring.application.name=users-management
server.port=${PORT:8080}

# Health endpoint: no secrets or infrastructure details in the response.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never

# Spring creates the DataSource and mail sender through application configuration.
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
spring.autoconfigure.exclude[2]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# PostgreSQL
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:5432}
db.name=${DB_NAME:crud_usuarios}
db.username=${DB_USERNAME:postgres}
db.password=${DB_PASSWORD:}
db.sslmode=${DB_SSLMODE:disable}
db.pool.maximum-size=${DB_POOL_MAX_SIZE:5}
db.pool.minimum-idle=${DB_POOL_MIN_IDLE:1}
db.pool.connection-timeout-ms=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false
spring.sql.init.encoding=UTF-8

# Optional first administrator. Keep disabled unless secure values are configured.
app.seed.admin.enabled=${SEED_ADMIN_ENABLED:false}
app.seed.admin.email=${SEED_ADMIN_EMAIL:}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:}

# Email: Gmail API is used in Render because outbound SMTP is blocked there.
app.email.enabled=${APP_EMAIL_ENABLED:false}
app.email.provider=${APP_EMAIL_PROVIDER:gmail}
email.gmail.client-id=${GMAIL_CLIENT_ID:}
email.gmail.client-secret=${GMAIL_CLIENT_SECRET:}
email.gmail.refresh-token=${GMAIL_REFRESH_TOKEN:}
email.gmail.sender-address=${GMAIL_SENDER_ADDRESS:}
email.gmail.sender-name=${GMAIL_SENDER_NAME:Gestion de Usuarios}

# Brevo transactional email REST API (selected with APP_EMAIL_PROVIDER=brevo).
brevo.base-url=${BREVO_BASE_URL:https://api.brevo.com}
brevo.api-key=${BREVO_API_KEY:}
brevo.from.address=${BREVO_FROM_ADDRESS:}
brevo.from.name=${BREVO_FROM_NAME:Gestion de Usuarios}
brevo.timeout.connect-ms=${BREVO_CONNECT_TIMEOUT_MS:3000}
brevo.timeout.read-ms=${BREVO_READ_TIMEOUT_MS:10000}

# Legacy SMTP adapter remains available for local installations only.
smtp.host=${SMTP_HOST:smtp.gmail.com}
smtp.port=${SMTP_PORT:587}
smtp.username=${SMTP_USERNAME:tu_correo@gmail.com}
smtp.password=${SMTP_PASSWORD:tu_app_password_aqui}
smtp.from.address=${SMTP_FROM_ADDRESS:tu_correo@gmail.com}
smtp.from.name=${SMTP_FROM_NAME:Gestion de Usuarios}

# CORS for the static Swagger UI on Vercel.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# JWT_SECRET is mandatory; Render generates a strong secret from render.yaml.
jwt.secret=${JWT_SECRET:}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
